<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Guide - Electronic Programme Guide</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1>TV Guide</h1>
            <div class="header-controls">
                <button id="goToNowBtn" class="btn btn-primary">Go to Now</button>
                <button id="toggleFavouritesBtn" class="btn btn-secondary">
                    <span id="favouritesToggleText">Show Favourites Only</span>
                </button>
                <button id="refreshBtn" class="btn btn-secondary">Refresh Guide</button>
            </div>
        </header>

        <!-- Loading State -->
        <div id="loadingState" class="loading-state">
            <div class="spinner"></div>
            <p>Loading TV Guide...</p>
        </div>

        <!-- Error State -->
        <div id="errorState" class="error-state" style="display: none;">
            <div class="error-message">
                <h2>Error Loading Guide</h2>
                <p id="errorMessage"></p>
                <button id="retryBtn" class="btn btn-primary">Retry</button>
            </div>
        </div>

        <!-- Main Guide Container -->
        <div id="guideContainer" class="guide-container" style="display: none;">
            <!-- Timeline Header -->
            <div class="guide-layout">
                <div class="corner-cell">
                    <span>Channels</span>
                </div>
                <div class="timeline-wrapper">
                    <div id="timelineHeader" class="timeline-header">
                        <!-- Timeline slots will be generated here -->
                    </div>
                </div>
            </div>

            <!-- Channels and Programme Grid -->
            <div class="guide-content">
                <div id="channelList" class="channel-list">
                    <!-- Channel list will be generated here -->
                </div>
                <div class="programme-wrapper">
                    <div id="programmeGrid" class="programme-grid">
                        <!-- Programme grid will be generated here -->
                    </div>
                </div>
            </div>

            <!-- Current Time Indicator -->
            <div id="currentTimeIndicator" class="current-time-indicator" style="display: none;">
                <div class="time-line"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
